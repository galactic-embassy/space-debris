[package]
name = "orbital-propagator"
version = "0.1.0"
edition = "2021"
description = "SGP4 satellite propagator compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sgp4 = "2.2"
js-sys = "0.3"
serde_json = "1.0"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
